<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Рабочее место 2 Sandbox</title>
  <link rel="stylesheet" href="./hc-report.css">
</head>
<body>
  <div id="sandbox-shell">
    <div style="padding:24px;font-family:'Segoe UI',sans-serif;">Загружаю новый отчет...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
  <script>
    var cacheKey = Date.now().toString();

    function loadScript(src) {
      return new Promise(function(resolve, reject) {
        var script = document.createElement('script');
        script.src = src + (src.indexOf('?') === -1 ? '?' : '&') + 'v=' + cacheKey;
        script.onload = resolve;
        script.onerror = reject;
        document.body.appendChild(script);
      });
    }

    function loadJson(url, targetName) {
      return fetch(url + '?v=' + cacheKey)
        .then(function(response) {
          if (!response.ok) {
            throw new Error('HTTP ' + response.status);
          }
          return response.json();
        })
        .then(function(payload) {
          window[targetName] = payload || null;
        });
    }

    function loadText(url, targetName) {
      return fetch(url + '?v=' + cacheKey)
        .then(function(response) {
          if (!response.ok) {
            throw new Error('HTTP ' + response.status);
          }
          return response.text();
        })
        .then(function(payload) {
          window[targetName] = payload || null;
        });
    }

    fetch('./index.html?v=' + cacheKey)
      .then(function(response) {
        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }
        return response.text();
      })
      .then(function(html) {
        document.getElementById('sandbox-shell').innerHTML = html;
        return loadJson('./report.default.json', 'HC_REPORT_DEFAULT_CONFIG')
          .then(function() { return loadJson('./report.manifest.json', 'HC_REPORT_MANIFEST'); })
          .then(function() { return loadText('./DS.txt', 'HC_REPORT_DS_TEXT'); })
          .then(function() { return loadScript('../../core/script.core.js'); })
          .then(function() { return loadScript('./script.js'); });
      })
      .catch(function(error) {
        document.getElementById('sandbox-shell').innerHTML =
          '<div style="padding:24px;font-family:Segoe UI,sans-serif;">' +
          '<h3>Не удалось открыть локальный стенд</h3>' +
          '<p>Откройте папку через локальный HTTP-сервер, например: <code>python -m http.server 8000</code></p>' +
          '<p>Детали: ' + String(error) + '</p>' +
          '</div>';
      });
  </script>
</body>
</html>
